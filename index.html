<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🩸 BHP BLOOD BOND</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#222;user-select:none}header{background:linear-gradient(135deg,#d90429,#ef233c);color:#fff;text-align:center;padding:28px 15px}h1{margin:0 0 8px}.wrap{max-width:900px;width:94%;margin:24px auto}.card{background:#fff;padding:22px;border-radius:16px;margin-bottom:20px;box-shadow:0 5px 20px #0001}h2{color:#d90429}label{display:block;font-weight:bold;margin:12px 0 6px}input,select,button{width:100%;padding:13px;border-radius:10px;font-size:16px}input,select{border:1px solid #ddd;background:#fff}button{border:0;background:#d90429;color:#fff;font-weight:bold;cursor:pointer;margin-top:10px}.donor{background:#fff;border:1px solid #eee;border-left:5px solid #d90429;border-radius:10px;padding:15px;margin-top:12px}.blood{display:inline-block;background:#d90429;color:#fff;padding:5px 10px;border-radius:20px;font-weight:bold}.call{display:inline-block;margin-top:10px;background:#168c3a;color:#fff;padding:10px 15px;border-radius:8px;text-decoration:none}.copy-number{color:#d90429;font-weight:bold;cursor:pointer}.empty{text-align:center;color:#777;padding:15px}footer{text-align:center;padding:25px;color:#777}</style></head><body><header><h1>🩸 BHP BLOOD BOND</h1><p>প্রয়োজনের সময় সহজেই রক্তদাতা খুঁজুন</p></header><main class="wrap"><section class="card"><h2>🔎 রক্তদাতা খুঁজুন</h2><label>রক্তের গ্রুপ</label><select id="sb"><option value="">সব রক্তের গ্রুপ</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select><label>জেলা</label><select id="sd"><option value="">জেলা নির্বাচন করুন</option></select><label>উপজেলা</label><select id="su"><option value="">উপজেলা নির্বাচন করুন</option></select><button onclick="search()">রক্তদাতা খুঁজুন</button></section><section class="card"><h2>🩸 রক্তদাতার তালিকা</h2><div id="out" class="empty">তথ্য নির্বাচন করে খুঁজুন।</div></section><section class="card"><h2>📝 রক্তদাতা হিসেবে নিবন্ধন</h2><label>নাম</label><input id="name" placeholder="নাম লিখুন"><label>ফোন নম্বর</label><input id="phone" type="tel" placeholder="01XXXXXXXXX"><label>রক্তের গ্রুপ</label><select id="bg"><option value="">নির্বাচন করুন</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select><label>জেলা</label><select id="rd"><option value="">জেলা নির্বাচন করুন</option></select><label>উপজেলা</label><select id="ru"><option value="">উপজেলা নির্বাচন করুন</option></select><button onclick="reg()">নিবন্ধন করুন</button></section></main><footer>© 2026 BHP BLOOD BOND</footer><script>
const L={"ভোলা":["ভোলা সদর","বোরহানউদ্দিন","চরফ্যাশন","দৌলতখান","লালমোহন","মনপুরা","তজুমদ্দিন"],"ঢাকা":["ধামরাই","দোহার","কেরানীগঞ্জ","নবাবগঞ্জ","সাভার"],"বরিশাল":["বরিশাল সদর","আগৈলঝাড়া","বাবুগঞ্জ","বাকেরগঞ্জ","বানারীপাড়া","গৌরনদী","হিজলা","মেহেন্দিগঞ্জ","মুলাদী","উজিরপুর"],"চট্টগ্রাম":["চট্টগ্রাম সদর","আনোয়ারা","বাঁশখালী","বোয়ালখালী","চন্দনাইশ","ফটিকছড়ি","হাটহাজারী","লোহাগাড়া","মীরসরাই","পটিয়া","রাঙ্গুনিয়া","রাউজান","সন্দ্বীপ","সাতকানিয়া","সীতাকুণ্ড"],"কুমিল্লা":["কুমিল্লা সদর","বরুড়া","ব্রাহ্মণপাড়া","বুড়িচং","চান্দিনা","চৌদ্দগ্রাম","দাউদকান্দি","দেবিদ্বার","হোমনা","লাকসাম","লালমাই","মুরাদনগর","নাঙ্গলকোট","মনোহরগঞ্জ","মেঘনা","তিতাস"],"ফরিদপুর":["ফরিদপুর সদর","আলফাডাঙ্গা","বোয়ালমারী","ভাঙ্গা","মধুখালী","নগরকান্দা","সদরপুর","সালথা","চরভদ্রাসন"],"গাজীপুর":["গাজীপুর সদর","কালিয়াকৈর","কালীগঞ্জ","কাপাসিয়া","শ্রীপুর"],"নারায়ণগঞ্জ":["নারায়ণগঞ্জ সদর","আড়াইহাজার","বন্দর","রূপগঞ্জ","সোনারগাঁ"],"ময়মনসিংহ":["ময়মনসিংহ সদর","ভালুকা","ধোবাউড়া","ফুলবাড়ীয়া","গফরগাঁও","গৌরীপুর","ঈশ্বরগঞ্জ","মুক্তাগাছা","নান্দাইল","ফুলপুর","ত্রিশাল","হালুয়াঘাট","তারাকান্দা"],"রাজশাহী":["রাজশাহী সদর","বাগমারা","বাঘা","চারঘাট","দুর্গাপুর","গোদাগাড়ী","মোহনপুর","পবা","পুঠিয়া","তানোর"],"খুলনা":["খুলনা সদর","বটিয়াঘাটা","দাকোপ","ডুমুরিয়া","দিঘলিয়া","কয়রা","পাইকগাছা","ফুলতলা","রূপসা","তেরখাদা"],"সিলেট":["সিলেট সদর","বালাগঞ্জ","বিয়ানীবাজার","বিশ্বনাথ","কোম্পানীগঞ্জ","ফেঞ্চুগঞ্জ","গোলাপগঞ্জ","গোয়াইনঘাট","জকিগঞ্জ","কানাইঘাট","ওসমানীনগর","দক্ষিণ সুরমা","জৈন্তাপুর"],"রংপুর":["রংপুর সদর","বদরগঞ্জ","গঙ্গাচড়া","কাউনিয়া","মিঠাপুকুর","পীরগঞ্জ","পীরগাছা","তারাগঞ্জ"],"দিনাজপুর":["দিনাজপুর সদর","বিরল","বীরগঞ্জ","বোচাগঞ্জ","চিরিরবন্দর","ফুলবাড়ী","ঘোড়াঘাট","হাকিমপুর","কাহারোল","খানসামা","নবাবগঞ্জ","পার্বতীপুর"],"বগুড়া":["বগুড়া সদর","আদমদীঘি","ধুনট","দুপচাঁচিয়া","গাবতলী","কাহালু","নন্দীগ্রাম","শেরপুর","শিবগঞ্জ","শাজাহানপুর","সারিয়াকান্দি","সোনাতলা"],"যশোর":["যশোর সদর","অভয়নগর","বাঘারপাড়া","চৌগাছা","ঝিকরগাছা","কেশবপুর","মনিরামপুর","শার্শা"]};
function fill(id){let s=document.getElementById(id);Object.keys(L).forEach(x=>s.add(new Option(x,x)))}function ups(d,u){let s=document.getElementById(u);s.innerHTML='<option value="">উপজেলা নির্বাচন করুন</option>';(L[document.getElementById(d).value]||[]).forEach(x=>s.add(new Option(x,x)))}fill('sd');fill('rd');sd.onchange=()=>ups('sd','su');rd.onchange=()=>ups('rd','ru');function data(){return JSON.parse(localStorage.getItem('bfd')||'[]')}function reg(){let x={name:name.value.trim(),phone:phone.value.trim(),blood:bg.value,district:rd.value,upazila:ru.value};if(Object.values(x).some(v=>!v))return alert('সব তথ্য পূরণ করুন।');let a=data();a.push(x);localStorage.setItem('bfd',JSON.stringify(a));alert('✅ নিবন্ধন সফল হয়েছে!');location.reload()}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function search(){let b=sb.value,d=sd.value,u=su.value,a=data().filter(x=>(!b||x.blood==b)&&(!d||x.district==d)&&(!u||x.upazila==u));out.innerHTML=a.length?a.map(x=>`<div class="donor"><h3>${esc(x.name)}</h3><span class="blood">${esc(x.blood)}</span><p>📍 ${esc(x.district)} → ${esc(x.upazila)}</p><p>☎️ <span class="copy-number" onclick="cp('${esc(x.phone)}')">${esc(x.phone)}</span></p><a class="call" href="tel:${esc(x.phone)}">📞 কল করুন</a></div>`).join(''):'<div class="empty">😔 কোনো রক্তদাতা পাওয়া যায়নি।</div>'}function cp(n){navigator.clipboard&&navigator.clipboard.writeText(n);alert('📋 ফোন নম্বর কপি হয়েছে!')}document.addEventListener('copy',e=>{if(!e.target.classList.contains('copy-number'))e.preventDefault()});document.addEventListener('contextmenu',e=>{if(!e.target.classList.contains('copy-number'))e.preventDefault()});
</script></body></html>
